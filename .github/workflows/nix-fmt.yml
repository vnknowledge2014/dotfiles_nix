name: Auto Format
on:
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  format:
    name: Auto-format Nix files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Format
        run: nix fmt

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format nix files"
          file_pattern: "*.nix"
