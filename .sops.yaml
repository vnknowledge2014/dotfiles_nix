# SOPS configuration — Secrets management cho team
# Docs: https://github.com/getsops/sops
#
# Workflow:
#   1. Mỗi member tạo Age key: age-keygen -o ~/.config/sops/age/keys.txt
#   2. Gửi PUBLIC KEY cho team lead
#   3. Team lead thêm key vào file này rồi re-encrypt: sops updatekeys secrets/shared/*.yaml
#   4. Tạo secret mới: sops secrets/shared/api-keys.yaml
#   5. Giải mã: sops -d secrets/shared/api-keys.yaml

creation_rules:
  # Secrets chung cho toàn team — tất cả members đều giải mã được
  - path_regex: secrets/shared/.*\.yaml$
    key_groups:
      - age:
          # Team Lead
          - age1dzyrhs443y6ssvucd5t54n0rw68pd6fyg4e0s5fsuj9rhu5ut50shgputs # mike
          # Members (thêm public key khi onboard)
          # - age1... # alice
          # - age1... # bob

  # Secrets riêng từng người — chỉ người đó giải mã được (mỗi người 1 rule)
  - path_regex: secrets/users/mike/.*\.yaml$
    key_groups:
      - age:
          - age1dzyrhs443y6ssvucd5t54n0rw68pd6fyg4e0s5fsuj9rhu5ut50shgputs # mike

  # Thêm người mới:
  # - path_regex: secrets/users/<username>/.*\.yaml$
  #   key_groups:
  #     - age:
  #         - age1... # <username>
